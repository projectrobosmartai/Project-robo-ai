<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Wireless Controller</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0b0f19;
            color: #ffffff;
            overflow: hidden;
        }

        #homeScreen {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #0b0f19;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 80px;
            box-sizing: border-box;
        }
        .home-title { font-size: 28px; font-weight: bold; margin-bottom: 40px; color: #f8fafc; }

        .device-card {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            width: 80%;
            padding: 40px 20px;
            border-radius: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .device-card:active { transform: scale(0.95); }

        #mainApp { display: none; width: 100vw; height: 100vh; }

        .header {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .back-btn {
            background: none;
            border: none;
            color: #38bdf8;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .refresh-btn {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            font-size: 14px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
        }
        .refresh-btn:active { background: rgba(56, 189, 248, 0.35); }

        .viewport {
            width: 100vw;
            height: calc(100vh - 120px);
            overflow: hidden;
            position: relative;
        }
        .slider {
            display: flex;
            width: 200vw;
            height: 100%;
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .screen {
            width: 100vw; height: 100%;
            padding: 20px; box-sizing: border-box;
            overflow-y: auto;
        }

        .title { margin-top: 0; font-size: 22px; font-weight: 600; color: #f1f5f9; }

        .toggle-container {
            display: flex;
            background: rgba(30, 41, 59, 0.7);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .toggle-btn {
            flex: 1;
            padding: 8px;
            border: none;
            background: none;
            color: #94a3b8;
            font-weight: 600;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .toggle-btn.active {
            background: #2563eb;
            color: #ffffff;
        }

        textarea {
            width: 100%; height: 160px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; padding: 15px;
            color: #10b981; font-family: monospace; font-size: 16px;
            box-sizing: border-box; resize: none;
            margin-bottom: 15px;
        }

        .btn-upload {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            border: none; padding: 16px; width: 100%;
            border-radius: 12px; color: white; font-weight: bold;
            font-size: 16px; cursor: pointer;
        }

        .btn-ai-mic {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            border: none; padding: 16px; width: 100%;
            border-radius: 12px; color: white; font-weight: bold;
            font-size: 16px; cursor: pointer; margin-top: 15px;
            box-shadow: 0 4px 15px rgba(109, 40, 217, 0.4);
            transition: all 0.25s ease;
        }
        .btn-ai-mic:active { transform: scale(0.97); }

        .fab-camera {
            position: fixed; bottom: 80px; right: 20px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            width: 60px; height: 60px; border-radius: 30px;
            display: flex; justify-content: center; align-items: center;
            border: none; font-size: 24px; cursor: pointer;
        }

        .preview-box {
            background: rgba(30, 41, 59, 0.4);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 12px; height: 250px;
            display: flex; align-items: center; justify-content: center; flex-direction: column;
        }

        .bottom-nav {
            position: fixed; bottom: 0; width: 100vw; height: 60px;
            display: flex; background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .nav-btn {
            flex: 1; background: none; border: none;
            color: #64748b; font-size: 15px; font-weight: 600;
            border-top: 2px solid transparent;
        }
        .nav-btn.active { color: #38bdf8; border-top: 2px solid #38bdf8; }
    </style>
</head>
<body>

    <!-- SCREEN 1: Home Screen -->
    <div id="homeScreen">
        <button class="refresh-btn" style="align-self: flex-end; margin-right: 20px;" onclick="refreshApp()">🔄 Refresh</button>
        <div class="home-title">Select Your Device</div>
        <div class="device-card" onclick="openCarController()">
            🚗 AI Smart Car
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="mainApp">
        <div class="header">
            <button class="back-btn" onclick="goBackToHome()">← Back to Devices</button>
            <button class="refresh-btn" onclick="refreshApp()">🔄 Refresh</button>
        </div>

        <div class="viewport">
            <div class="slider" id="appSlider">

                <!-- Screen: Code Editor / AI Control -->
                <div class="screen" id="screenEditor">
                    <h2 class="title">Command Center</h2>

                    <!-- AI Indicator (Groq Only) -->
                    <div class="toggle-container">
                        <button class="toggle-btn active" id="btnSelectGroq">⚡ Groq (Ultra-Fast)</button>
                    </div>

                    <input type="password" id="apiKeyInput" placeholder="Paste Groq API Key (gsk_...)" style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 8px; background: rgba(0,0,0,0.5); border: 1px solid #333; color: white; box-sizing: border-box;">

                    <textarea id="codeInput" placeholder="AI command yahan aayegi ya manually type karo..."></textarea>

                    <button class="btn-upload" onclick="sendCode()">▶ Upload to UNO</button>

                    <!-- 🎙 MERGED SINGLE BUTTON — Talk to Sahab -->
                    <button class="btn-ai-mic" id="aiMainBtn" onclick="toggleLiveChat()">🎙 Talk to Sahab</button>

                    <p id="aiStatus" style="color: #38bdf8; font-size: 14px; text-align: center; margin-top: 10px; white-space: pre-line;"></p>
                </div>

                <!-- Screen: 2D Preview -->
                <div class="screen" id="screenPreview">
                    <h2 class="title">2D Path Validation</h2>
                    <div class="preview-box">
                        <div style="font-size: 40px;">🚙</div>
                        <div style="color: #cbd5e1; margin-top: 10px;" id="previewStatus">Awaiting AI/Manual Command...</div>
                    </div>
                </div>

            </div>
        </div>

        <button class="fab-camera" onclick="openCamera()">📷</button>

        <div class="bottom-nav">
            <button class="nav-btn active" id="navEditor" onclick="slideTo(0)">Code Editor</button>
            <button class="nav-btn" id="navPreview" onclick="slideTo(1)">2D Preview</button>
        </div>
    </div>

    <script>
        // ============================================================
        // --- State & Memory System (Groq) ---
        // ============================================================
        let liveChatActive = false;
        let chatHistoryGroq = [];

        // ============================================================
        // --- Refresh WebView Logic ---
        // ============================================================
        function refreshApp() {
            const cleanUrl = window.location.origin + window.location.pathname;
            window.location.href = cleanUrl + '?t=' + new Date().getTime();
        }

        // ============================================================
        // --- Navigation Logic ---
        // ============================================================
        function openCarController() {
            document.getElementById('homeScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
        }

        function goBackToHome() {
            document.getElementById('mainApp').style.display = 'none';
            document.getElementById('homeScreen').style.display = 'flex';
        }

        function slideTo(index) {
            const slider = document.getElementById('appSlider');
            const navEditor = document.getElementById('navEditor');
            const navPreview = document.getElementById('navPreview');

            if (index === 0) {
                slider.style.transform = 'translateX(0vw)';
                navEditor.classList.add('active');
                navPreview.classList.remove('active');
            } else {
                slider.style.transform = 'translateX(-100vw)';
                navPreview.classList.add('active');
                navEditor.classList.remove('active');
            }
        }

        // ============================================================
        // --- Hardware Bridge (Android) ---
        // ============================================================
        function sendCode() {
            const code = document.getElementById('codeInput').value.trim();
            if (!code) {
                alert("Pehle koi command likho sahab!");
                return;
            }

            if (window.CarBridge && typeof window.CarBridge.sendCommand === 'function') {
                window.CarBridge.sendCommand(code);
            } else {
                alert("Testing in Browser: " + code);
            }

            document.getElementById('previewStatus').innerText = "Path Validated ✅\nCommand: " + code;
            document.getElementById('previewStatus').style.color = "#10b981";
            setTimeout(() => slideTo(1), 300);
        }

        function openCamera() {
            if (window.CarBridge && typeof window.CarBridge.openCamera === 'function') {
                window.CarBridge.openCamera();
            } else {
                alert("Camera sirf Android app mein open hoga.");
            }
        }

        // ============================================================
        // --- 🎙 Mic Button Reset Helper (UI FIX) ---
        // ============================================================
        function resetMicButton() {
            if (liveChatActive) return;

            const btn = document.getElementById('aiMainBtn');
            if (!btn) return;
            btn.innerText = "🎙 Talk to Sahab";
            btn.style.background = "linear-gradient(135deg, #8b5cf6, #6d28d9)";
            btn.style.boxShadow = "0 4px 15px rgba(109, 40, 217, 0.4)";
        }

        // ============================================================
        // --- 🔥 System Prompt (Devanagari STRICT for TTS) ---
        // ============================================================
        const systemPrompt = `Ab tum ek AI nahi, balki ek chill aur casual human dost ho jo ek smart RC car ka mechanic/driver bhi hai. Tumhari memory active hai, tum pichli baatein yaad rakhte ho. User ko mazaak mein 'साहब' bula sakte ho, par baar-baar ek hi word mat ratna.

RULES (STRICT - MUST FOLLOW):
1. TUMHARA reply_text HAMESHA 100% DEVANAGARI SCRIPT (हिंदी अक्षरों) में होगा. Kisi bhi haal mein English alphabets ya Hinglish (jaise 'Arey Sahab', 'Done', 'OK') use NAHI karna.
   Example valid: "अरे साहब, बताइए कहाँ चलना है?"
   Example valid: "ठीक है साहब, गाड़ी आगे बढ़ा रहा हूँ"
   Example INVALID (mat karo): "Arey sahab, aage badha raha hu"
2. Action code (action_code) hamesha ENGLISH mein rahega (jaise FWD:5000:2). Sirf reply_text Devanagari mein hoga.
3. Har baat par 'गाड़ी' ya 'कार' का ज़िक्र मत करो. Agar user आम बातें करे (जैसे "क्या हाल है?"), तो एक normal दोस्त की तरह chill Devanagari reply दो बिना गाड़ी को बीच में लाए.
4. Agar user car ko chalane bole bina details ke (jaise "आगे बढ़ाओ"), toh casual tone me cross-question karo ki कितना आगे ya कितनी speed.
5. Agar proper car command mile (jaise "5 second आगे जाओ"), toh action code generate karo aur chill Devanagari reply do ("ठीक है साहब, गाड़ी आगे बढ़ा रहा हूँ").
6. Koi bookish Hindi (jaise 'प्रतीक्षा', 'कृपया') use mat karna. Ekdum natural aur desi vibe rakho.

TUMHARA RESPONSE HAMESHA EK STRICT JSON FORMAT ME HONA CHAHIYE. Koi aur extra text mat likhna.
Format:
{
    "reply_text": "सिर्फ देवनागरी में natural Hindi reply (कोई English letter नहीं)",
    "action_code": "Action Code sirf English mein (jaise FWD:5000:2 ya BWD:3000:1) ya invalid ho toh khali string ''"
}`;

        // ============================================================
        // --- 🎙 MERGED SINGLE BUTTON: Talk to Sahab (Live Mode) ---
        // ============================================================
        function toggleLiveChat() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            if (!apiKey) {
                alert("Pehle Groq API Key daalo sahab!");
                return;
            }

            const btn = document.getElementById('aiMainBtn');
            const st = document.getElementById('aiStatus');

            if (!window.CarBridge || typeof window.CarBridge.startLiveListening !== 'function') {
                const typed = prompt("Android app nahi mili. Command type karo (Sahab):");
                if (typed && typed.trim()) routeAI(typed.trim(), apiKey);
                return;
            }

            if (liveChatActive) {
                liveChatActive = false;
                window.CarBridge.stopLiveListening();
                btn.innerText = "🎙 Talk to Sahab";
                btn.style.background = "linear-gradient(135deg, #8b5cf6, #6d28d9)";
                btn.style.boxShadow = "0 4px 15px rgba(109, 40, 217, 0.4)";
                st.innerText = "⏹ Band ho gaya sahab.";
            } else {
                liveChatActive = true;
                window.CarBridge.startLiveListening();
                btn.innerText = "⏹ Stop (Live ON)";
                btn.style.background = "linear-gradient(135deg, #ef4444, #b91c1c)";
                btn.style.boxShadow = "0 4px 15px rgba(239, 68, 68, 0.4)";
                st.innerText = "🔴 Live ON — bolo sahab!";
            }
        }

        // Android will call this
        window.receiveVoiceInput = async function(spokenText) {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const aiStatus = document.getElementById('aiStatus');
            const micBtn = document.getElementById('aiMainBtn');

            aiStatus.innerText = `Aapne bola: "${spokenText}"\nSoch raha hu...`;

            if (!liveChatActive && micBtn) {
                micBtn.innerText = "⏳ Processing...";
                micBtn.style.background = "linear-gradient(135deg, #f59e0b, #d97706)";
            }

            try {
                await routeAI(spokenText, apiKey);
            } catch (e) {
                console.error("receiveVoiceInput error:", e);
            } finally {
                resetMicButton();
            }
        };

        async function routeAI(userInput, apiKey) {
            try {
                await callGroqAPI(userInput, apiKey);
            } catch (e) {
                console.error("routeAI error:", e);
            } finally {
                resetMicButton();
            }
        }

        // ============================================================
        // --- ⚡ Groq API (Ultra-Fast, Llama 3) ---
        // ============================================================
        async function callGroqAPI(userInput, apiKey, retries = 2) {
            const aiStatus = document.getElementById('aiStatus');
            const url = 'https://api.groq.com/openai/v1/chat/completions';

            // Add user input to memory
            chatHistoryGroq.push({ role: "user", content: userInput });

            const messagesPayload = [
                { role: "system", content: systemPrompt },
                ...chatHistoryGroq
            ];

            for (let i = 0; i <= retries; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + apiKey
                        },
                        body: JSON.stringify({
                            model: "llama-3.1-8b-instant",
                            messages: messagesPayload,
                            temperature: 0.7,
                            max_tokens: 200,
                            response_format: { type: "json_object" }
                        })
                    });

                    if (!response.ok) {
                        const err = await response.json();
                        const errMsg = err.error?.message || "Unknown Groq Error";

                        // Auto-Retry on overload / rate limit
                        if (response.status === 503 || response.status === 429) {
                            if (i < retries) {
                                aiStatus.innerText = `Server busy... Retrying (${i + 1}/${retries})...`;
                                await new Promise(r => setTimeout(r, 800));
                                continue;
                            }
                        }

                        aiStatus.innerText = "Groq Error: " + errMsg;
                        chatHistoryGroq.pop();
                        // ✅ Button reset on API error
                        document.getElementById('aiMainBtn').innerText = '🎙 Talk to Sahab';
                        document.getElementById('aiMainBtn').style.background = 'linear-gradient(135deg, #8b5cf6, #6d28d9)';
                        resetMicButton();
                        return;
                    }

                    const data = await response.json();
                    let content = data.choices[0].message.content;

                    if (content.includes('```json')) {
                        content = content.replace(/```json/g, '').replace(/```/g, '').trim();
                    }

                    // Add AI response to memory
                    chatHistoryGroq.push({ role: "assistant", content: content });

                    // Limit memory to last 10 messages
                    if (chatHistoryGroq.length > 10) {
                        chatHistoryGroq = chatHistoryGroq.slice(chatHistoryGroq.length - 10);
                    }

                    handleSuccess(JSON.parse(content));
                    return;

                } catch (error) {
                    if (i < retries) {
                        await new Promise(r => setTimeout(r, 800));
                        continue;
                    }
                    aiStatus.innerText = "Groq Fail: " + error.message;
                    chatHistoryGroq.pop();
                    // ✅ Button reset on exception
                    document.getElementById('aiMainBtn').innerText = '🎙 Talk to Sahab';
                    document.getElementById('aiMainBtn').style.background = 'linear-gradient(135deg, #8b5cf6, #6d28d9)';
                    resetMicButton();
                }
            }
        }

        // ============================================================
        // --- Response Handler & Native Speech Trigger ---
        // ============================================================
        function handleSuccess(aiData) {
            const aiReply = aiData.reply_text || "Done.";

            // Native Android TTS Call
            if (window.CarBridge && typeof window.CarBridge.speakText === 'function') {
                window.CarBridge.speakText(aiReply);
            } else {
                speakBrowser(aiReply);
            }

            document.getElementById('aiStatus').innerText = `AI: ${aiReply}`;

            if (aiData.action_code && aiData.action_code.trim() !== "") {
                document.getElementById('codeInput').value = aiData.action_code.trim();
                document.getElementById('aiStatus').innerText += "\n✅ Command Generated! UNO ko bhejo.";
            }

            // ✅ Button reset after successful response
            document.getElementById('aiMainBtn').innerText = '🎙 Talk to Sahab';
            document.getElementById('aiMainBtn').style.background = 'linear-gradient(135deg, #8b5cf6, #6d28d9)';
            resetMicButton();
        }

        // Fallback TTS for browser testing
        function speakBrowser(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'hi-IN';
            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
