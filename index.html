<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Wireless Controller</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0b0f19;
            color: #ffffff;
            overflow: hidden;
        }
        #homeScreen {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #0b0f19;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 80px;
            box-sizing: border-box;
        }
        .home-title { font-size: 28px; font-weight: bold; margin-bottom: 40px; color: #f8fafc; }
        .device-card {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            width: 80%;
            padding: 40px 20px;
            border-radius: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .device-card:active { transform: scale(0.95); }
        #mainApp { display: none; width: 100vw; height: 100vh; }
        .header {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .back-btn { background: none; border: none; color: #38bdf8; font-size: 16px; font-weight: 600; cursor: pointer; }
        .refresh-btn {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            font-size: 14px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
        }
        .refresh-btn:active { background: rgba(56, 189, 248, 0.35); }
        .viewport { width: 100vw; height: calc(100vh - 120px); overflow: hidden; position: relative; }
        .slider { display: flex; width: 200vw; height: 100%; transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1); }
        .screen { width: 100vw; height: 100%; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .title { margin-top: 0; font-size: 22px; font-weight: 600; color: #f1f5f9; }
        .toggle-container {
            display: flex;
            background: rgba(30, 41, 59, 0.7);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .toggle-btn {
            flex: 1;
            padding: 8px;
            border: none;
            background: none;
            color: #94a3b8;
            font-weight: 600;
            font-size: 13px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .toggle-btn.active { background: #2563eb; color: #ffffff; }
        textarea {
            width: 100%; height: 160px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; padding: 15px;
            color: #10b981; font-family: monospace; font-size: 16px;
            box-sizing: border-box; resize: none;
            margin-bottom: 15px;
        }
        .btn-upload {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            border: none; padding: 16px; width: 100%;
            border-radius: 12px; color: white; font-weight: bold;
            font-size: 16px; cursor: pointer;
        }
        .btn-ai-mic {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            border: none; padding: 16px; width: 100%;
            border-radius: 12px; color: white; font-weight: bold;
            font-size: 16px; cursor: pointer; margin-top: 15px;
            box-shadow: 0 4px 15px rgba(109, 40, 217, 0.4);
            transition: all 0.25s ease;
        }
        .btn-ai-mic:active { transform: scale(0.97); }
        .fab-camera {
            position: fixed; bottom: 80px; right: 20px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            width: 60px; height: 60px; border-radius: 30px;
            display: flex; justify-content: center; align-items: center;
            border: none; font-size: 24px; cursor: pointer;
        }
        .preview-box {
            background: rgba(30, 41, 59, 0.4);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 12px; height: 250px;
            display: flex; align-items: center; justify-content: center; flex-direction: column;
        }
        .bottom-nav {
            position: fixed; bottom: 0; width: 100vw; height: 60px;
            display: flex; background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .nav-btn {
            flex: 1; background: none; border: none;
            color: #64748b; font-size: 15px; font-weight: 600;
            border-top: 2px solid transparent;
        }
        .nav-btn.active { color: #38bdf8; border-top: 2px solid #38bdf8; }
    </style>
</head>
<body>

    <div id="homeScreen">
        <button class="refresh-btn" style="align-self: flex-end; margin-right: 20px;" onclick="refreshApp()">🔄 Refresh</button>
        <div class="home-title">Select Your Device</div>
        <div class="device-card" onclick="openCarController()">
            🚗 AI Smart Car
        </div>
    </div>

    <div id="mainApp">
        <div class="header">
            <button class="back-btn" onclick="goBackToHome()">← Back to Devices</button>
            <button class="refresh-btn" onclick="refreshApp()">🔄 Refresh</button>
        </div>

        <div class="viewport">
            <div class="slider" id="appSlider">

                <div class="screen" id="screenEditor">
                    <h2 class="title">Command Center</h2>

                    <div class="toggle-container">
                        <button class="toggle-btn active" id="btnSelectGroq" onclick="switchAI('groq')">⚡ Groq</button>
                        <button class="toggle-btn" id="btnSelectGemini" onclick="switchAI('gemini')">Gemini</button>
                        <button class="toggle-btn" id="btnSelectOpenAI" onclick="switchAI('openai')">OpenAI</button>
                    </div>

                    <input type="password" id="apiKeyInput" placeholder="Paste Groq API Key (gsk_...)" style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 8px; background: rgba(0,0,0,0.5); border: 1px solid #333; color: white; box-sizing: border-box;">

                    <textarea id="codeInput" placeholder="AI command yahan aayegi ya manually type karo..."></textarea>

                    <button class="btn-upload" onclick="sendCode()">▶ Upload to UNO</button>

                    <button class="btn-ai-mic" id="aiMainBtn" onclick="toggleLiveChat()">🎙 Talk to Sahab</button>

                    <p id="aiStatus" style="color: #38bdf8; font-size: 14px; text-align: center; margin-top: 10px; white-space: pre-line;"></p>
                </div>

                <div class="screen" id="screenPreview">
                    <h2 class="title">2D Path Validation</h2>
                    <div class="preview-box">
                        <div style="font-size: 40px;">🚙</div>
                        <div style="color: #cbd5e1; margin-top: 10px;" id="previewStatus">Awaiting AI/Manual Command...</div>
                    </div>
                </div>

            </div>
        </div>

        <button class="fab-camera" onclick="openCamera()">📷</button>

        <div class="bottom-nav">
            <button class="nav-btn active" id="navEditor" onclick="slideTo(0)">Code Editor</button>
            <button class="nav-btn" id="navPreview" onclick="slideTo(1)">2D Preview</button>
        </div>
    </div>

    <script>
        let selectedAI = 'groq';
        let liveChatActive = false;
        let chatHistoryGroq = [];
        let chatHistoryGemini = [];
        let chatHistoryOpenAI = [];

        function switchAI(provider) {
            selectedAI = provider;
            const gq = document.getElementById('btnSelectGroq');
            const g = document.getElementById('btnSelectGemini');
            const o = document.getElementById('btnSelectOpenAI');
            const k = document.getElementById('apiKeyInput');

            gq.classList.remove('active');
            g.classList.remove('active');
            o.classList.remove('active');

            if (provider === 'groq') {
                gq.classList.add('active');
                k.placeholder = "Paste Groq API Key (gsk_...)";
            } else if (provider === 'gemini') {
                g.classList.add('active');
                k.placeholder = "Paste Gemini API Key (AIzaSy...)";
            } else {
                o.classList.add('active');
                k.placeholder = "Paste OpenAI API Key (sk-...)";
            }
        }

        function refreshApp() {
            const cleanUrl = window.location.origin + window.location.pathname;
            window.location.href = cleanUrl + '?t=' + new Date().getTime();
        }

        function openCarController() {
            document.getElementById('homeScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
        }

        function goBackToHome() {
            document.getElementById('mainApp').style.display = 'none';
            document.getElementById('homeScreen').style.display = 'flex';
        }

        function slideTo(index) {
            const slider = document.getElementById('appSlider');
            const ne = document.getElementById('navEditor');
            const np = document.getElementById('navPreview');
            if (index === 0) {
                slider.style.transform = 'translateX(0vw)';
                ne.classList.add('active');
                np.classList.remove('active');
            } else {
                slider.style.transform = 'translateX(-100vw)';
                np.classList.add('active');
                ne.classList.remove('active');
            }
        }

        function sendCode() {
            const code = document.getElementById('codeInput').value.trim();
            if (!code) { alert("Pehle koi command likho sahab!"); return; }
            if (window.CarBridge && window.CarBridge.sendCommand) {
                window.CarBridge.sendCommand(code);
            } else {
                alert("Testing: " + code);
            }
            document.getElementById('previewStatus').innerText = "Path Validated ✅\nCommand: " + code;
            document.getElementById('previewStatus').style.color = "#10b981";
            setTimeout(() => slideTo(1), 300);
        }

        function openCamera() {
            if (window.CarBridge && window.CarBridge.openCamera) window.CarBridge.openCamera();
            else alert("Camera sirf Android app mein.");
        }

        function resetMicBtn() {
            if (liveChatActive) return;
            const btn = document.getElementById('aiMainBtn');
            if (!btn) return;
            btn.innerText = "🎙 Talk to Sahab";
            btn.style.background = "linear-gradient(135deg, #8b5cf6, #6d28d9)";
        }

        const systemPrompt = `Ab tum ek AI nahi, balki ek chill aur casual human dost ho jo ek smart RC car ka mechanic/driver bhi hai. Tumhari memory active hai. RULES (STRICT): 1. TUMHARA reply_text HAMESHA 100% DEVANAGARI SCRIPT (हिंदी अक्षरों) में होगा. Kisi bhi haal mein English alphabets ya Hinglish (jaise Arey Sahab, Done, OK) use NAHI karna. Example valid: "अरे साहब, बताइए कहाँ चलना है?" Example INVALID: "Arey sahab, aage badha raha hu". 2. Action code hamesha ENGLISH mein (jaise FWD:5000:2). 3. Har baat par gaadi ka zikra mat karo. Aam baat cheet mein normal dost ki tarah reply do. 4. Bina details ke car command pe cross-question karo. 5. Bookish Hindi use mat karna.

TUMHARA RESPONSE HAMESHA EK STRICT JSON FORMAT ME HONA CHAHIYE:
{
    "reply_text": "सिर्फ देवनागरी में reply",
    "action_code": "English action ya khali string ''"
}`;

        function toggleLiveChat() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            if (!apiKey) {
                const pName = selectedAI === 'groq' ? 'Groq' : (selectedAI === 'gemini' ? 'Gemini' : 'OpenAI');
                alert(`Pehle ${pName} API Key daalo sahab!`);
                return;
            }
            const btn = document.getElementById('aiMainBtn');
            const st = document.getElementById('aiStatus');

            if (!window.CarBridge || typeof window.CarBridge.startLiveListening !== 'function') {
                const typed = prompt("Android app nahi mili. Command type karo:");
                if (typed && typed.trim()) routeAI(typed.trim(), apiKey);
                return;
            }

            if (liveChatActive) {
                liveChatActive = false;
                window.CarBridge.stopLiveListening();
                btn.innerText = "🎙 Talk to Sahab";
                btn.style.background = "linear-gradient(135deg, #8b5cf6, #6d28d9)";
                st.innerText = "⏹ Band ho gaya.";
            } else {
                liveChatActive = true;
                window.CarBridge.startLiveListening();
                btn.innerText = "⏹ Stop (Live ON)";
                btn.style.background = "linear-gradient(135deg, #ef4444, #b91c1c)";
                st.innerText = "🔴 Live — bolo sahab!";
            }
        }

        window.receiveVoiceInput = async function(spokenText) {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const st = document.getElementById('aiStatus');
            if (st) st.innerText = `Aapne bola: "${spokenText}"\nSoch raha hu...`;
            try { await routeAI(spokenText, apiKey); }
            catch (e) { console.error('receiveVoiceInput', e); }
            finally { resetMicBtn(); }
        };

        async function routeAI(userInput, apiKey) {
            try {
                if (selectedAI === 'groq') await callGroqAPI(userInput, apiKey);
                else if (selectedAI === 'gemini') await callGemini(userInput, apiKey);
                else await callOpenAI(userInput, apiKey);
            } catch (e) { console.error('routeAI', e); }
            finally { resetMicBtn(); }
        }

        // ⚡ GROQ API
        async function callGroqAPI(userInput, apiKey) {
            const st = document.getElementById('aiStatus');
            chatHistoryGroq.push({ role: "user", content: userInput });
            const messagesPayload = [{ role: "system", content: systemPrompt }, ...chatHistoryGroq];

            try {
                const r = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + apiKey
                    },
                    body: JSON.stringify({
                        model: 'llama-3.1-8b-instant',
                        messages: messagesPayload,
                        temperature: 0.7,
                        max_tokens: 100,
                        response_format: { type: "json_object" }
                    })
                });
                if (!r.ok) {
                    const e = await r.json();
                    st.innerText = "Groq Error: " + (e.error?.message || "Check API Key");
                    chatHistoryGroq.pop();
                    resetMicBtn();
                    return;
                }
                const d = await r.json();
                let c = d.choices[0].message.content;
                if (c.includes('```json')) c = c.replace(/```json/g, '').replace(/```/g, '').trim();

                let parsed;
                try { parsed = JSON.parse(c); }
                catch (pe) { st.innerText = "Groq Parse Fail: " + pe.message; resetMicBtn(); return; }

                chatHistoryGroq.push({ role: "assistant", content: c });
                if (chatHistoryGroq.length > 10) chatHistoryGroq = chatHistoryGroq.slice(-10);

                handleSuccess(parsed);
            } catch (e) {
                st.innerText = "Groq Fail: " + e.message;
                chatHistoryGroq.pop();
                resetMicBtn();
            }
        }

        // GEMINI
        async function callGemini(userInput, apiKey) {
            const st = document.getElementById('aiStatus');
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-8b:generateContent?key=${apiKey}`;
            chatHistoryGemini.push({ role: "user", parts: [{ text: userInput }] });

            try {
                const r = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: { parts: [{ text: systemPrompt }] },
                        contents: chatHistoryGemini,
                        generationConfig: {
                            response_mime_type: "application/json",
                            maxOutputTokens: 100,
                            temperature: 0.5
                        }
                    })
                });
                if (!r.ok) {
                    const e = await r.json();
                    st.innerText = "Gemini Error: " + (e.error?.message || "Check API Key");
                    chatHistoryGemini.pop();
                    resetMicBtn();
                    return;
                }
                const d = await r.json();
                let raw = d.candidates[0].content.parts[0].text;
                if (raw.includes('```json')) raw = raw.replace(/```json/g, '').replace(/```/g, '').trim();

                let parsed;
                try { parsed = JSON.parse(raw); }
                catch (pe) { st.innerText = "Gemini Parse Fail: " + pe.message; resetMicBtn(); return; }

                chatHistoryGemini.push({ role: "model", parts: [{ text: raw }] });
                if (chatHistoryGemini.length > 10) chatHistoryGemini = chatHistoryGemini.slice(-10);

                handleSuccess(parsed);
            } catch (e) {
                st.innerText = "Gemini Fail: " + e.message;
                chatHistoryGemini.pop();
                resetMicBtn();
            }
        }

        // OPENAI
        async function callOpenAI(userInput, apiKey) {
            const st = document.getElementById('aiStatus');
            chatHistoryOpenAI.push({ role: "user", content: userInput });
            const messagesPayload = [{ role: "system", content: systemPrompt }, ...chatHistoryOpenAI];

            try {
                const r = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "gpt-4o-mini",
                        messages: messagesPayload,
                        temperature: 0.7,
                        max_tokens: 100,
                        response_format: { type: "json_object" }
                    })
                });
                if (!r.ok) {
                    const e = await r.json();
                    st.innerText = "OpenAI Error: " + (e.error?.message || "Check API Key");
                    chatHistoryOpenAI.pop();
                    resetMicBtn();
                    return;
                }
                const d = await r.json();
                let c = d.choices[0].message.content;
                if (c.includes('```json')) c = c.replace(/```json/g, '').replace(/```/g, '').trim();

                let parsed;
                try { parsed = JSON.parse(c); }
                catch (pe) { st.innerText = "OpenAI Parse Fail: " + pe.message; resetMicBtn(); return; }

                chatHistoryOpenAI.push({ role: "assistant", content: c });
                if (chatHistoryOpenAI.length > 10) chatHistoryOpenAI = chatHistoryOpenAI.slice(-10);

                handleSuccess(parsed);
            } catch (e) {
                st.innerText = "OpenAI Fail: " + e.message;
                chatHistoryOpenAI.pop();
                resetMicBtn();
            }
        }

        function handleSuccess(aiData) {
            try {
                if (!aiData || typeof aiData !== 'object') throw new Error("Empty AI data");
                const aiReply = aiData.reply_text || "Done.";
                if (window.CarBridge && typeof window.CarBridge.speakText === 'function') {
                    window.CarBridge.speakText(aiReply);
                } else if (window.speechSynthesis) {
                    window.speechSynthesis.cancel();
                    const u = new SpeechSynthesisUtterance(aiReply);
                    u.lang = 'hi-IN'; u.rate = 0.9; u.pitch = 1.05;
                    window.speechSynthesis.speak(u);
                }
                document.getElementById('aiStatus').innerText = `AI: ${aiReply}`;
                if (aiData.action_code && aiData.action_code.trim() !== "") {
                    document.getElementById('codeInput').value = aiData.action_code.trim();
                    document.getElementById('aiStatus').innerText += "\n✅ Command Generated!";
                }
            } catch (e) { console.error('handleSuccess', e); }
            finally { resetMicBtn(); }
        }
    </script>
</body>
</html>
