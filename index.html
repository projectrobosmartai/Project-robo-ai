<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Wireless Controller</title>
    <style>
        /* Modern Reset & Dark Glassmorphic Theme */
        body { 
            margin: 0; 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: #0b0f19; 
            color: #ffffff; 
            overflow: hidden; 
        }
        
        /* --- HOME SCREEN UI --- */
        #homeScreen {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #0b0f19;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 80px;
            box-sizing: border-box;
        }
        .home-title { font-size: 28px; font-weight: bold; margin-bottom: 40px; color: #f8fafc; }
        
        .device-card {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            width: 80%;
            padding: 40px 20px;
            border-radius: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .device-card:active { transform: scale(0.95); }

        /* --- MAIN APP UI --- */
        #mainApp {
            display: none;
            width: 100vw; height: 100vh;
        }

        .header { 
            background: rgba(15, 23, 42, 0.7); 
            backdrop-filter: blur(10px); 
            padding: 15px 20px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .back-btn { 
            background: none; 
            border: none; 
            color: #38bdf8; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
        }

        .refresh-btn {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            font-size: 14px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
        }
        .refresh-btn:active { background: rgba(56, 189, 248, 0.35); }

        .viewport {
            width: 100vw;
            height: calc(100vh - 120px); 
            overflow: hidden;
            position: relative;
        }
        .slider {
            display: flex;
            width: 200vw; 
            height: 100%;
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .screen {
            width: 100vw; height: 100%;
            padding: 20px; box-sizing: border-box;
            overflow-y: auto;
        }

        .title { margin-top: 0; font-size: 22px; font-weight: 600; color: #f1f5f9; }

        /* --- AI TOGGLE SWITCH --- */
        .toggle-container {
            display: flex;
            background: rgba(30, 41, 59, 0.7);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .toggle-btn {
            flex: 1;
            padding: 8px;
            border: none;
            background: none;
            color: #94a3b8;
            font-weight: 600;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .toggle-btn.active {
            background: #2563eb;
            color: #ffffff;
        }
        
        textarea { 
            width: 100%; height: 160px; 
            background: rgba(30, 41, 59, 0.6); 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 12px; padding: 15px; 
            color: #10b981; font-family: monospace; font-size: 16px; 
            box-sizing: border-box; resize: none; 
            margin-bottom: 15px;
        }

        .btn-upload { 
            background: linear-gradient(135deg, #0284c7, #2563eb); 
            border: none; padding: 16px; width: 100%; 
            border-radius: 12px; color: white; font-weight: bold; 
            font-size: 16px; cursor: pointer;
        }

        .btn-ai-mic {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            border: none; padding: 16px; width: 100%; 
            border-radius: 12px; color: white; font-weight: bold; 
            font-size: 16px; cursor: pointer; margin-top: 15px;
            box-shadow: 0 4px 15px rgba(109, 40, 217, 0.4);
        }

        .fab-camera {
            position: fixed; bottom: 80px; right: 20px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            width: 60px; height: 60px; border-radius: 30px;
            display: flex; justify-content: center; align-items: center;
            border: none; font-size: 24px; cursor: pointer;
        }

        .preview-box {
            background: rgba(30, 41, 59, 0.4);
            border: 1px dashed rgba(255,255,255,0.2);
            border-radius: 12px; height: 250px;
            display: flex; align-items: center; justify-content: center; flex-direction: column;
        }

        .bottom-nav { 
            position: fixed; bottom: 0; width: 100vw; height: 60px;
            display: flex; background: rgba(15, 23, 42, 0.95); 
            border-top: 1px solid rgba(255,255,255,0.05); 
        }
        .nav-btn { 
            flex: 1; background: none; border: none; 
            color: #64748b; font-size: 15px; font-weight: 600; 
            border-top: 2px solid transparent;
        }
        .nav-btn.active { color: #38bdf8; border-top: 2px solid #38bdf8; }
    </style>
</head>
<body>

    <!-- SCREEN 1: Home Screen (Device Selection) -->
    <div id="homeScreen">
        <button class="refresh-btn" style="align-self: flex-end; margin-right: 20px;" onclick="refreshApp()">🔄 Refresh</button>
        <div class="home-title">Select Your Device</div>
        <div class="device-card" onclick="openCarController()">
            🚗 AI Smart Car
        </div>
    </div>

    <!-- MAIN APP: Shown after selecting car -->
    <div id="mainApp">
        <div class="header">
            <button class="back-btn" onclick="goBackToHome()">← Back to Devices</button>
            <button class="refresh-btn" onclick="refreshApp()">🔄 Refresh</button>
        </div>

        <div class="viewport">
            <div class="slider" id="appSlider">
                
                <!-- Screen: Code Editor / AI Control -->
                <div class="screen" id="screenEditor">
                    <h2 class="title">Command Center</h2>

                    <!-- AI Toggle Selector -->
                    <div class="toggle-container">
                        <button class="toggle-btn active" id="btnSelectGemini" onclick="switchAI('gemini')">Gemini (Free)</button>
                        <button class="toggle-btn" id="btnSelectOpenAI" onclick="switchAI('openai')">OpenAI (GPT)</button>
                    </div>
                    
                    <input type="password" id="apiKeyInput" placeholder="Paste Gemini API Key (AIzaSy...)" style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 8px; background: rgba(0,0,0,0.5); border: 1px solid #333; color: white; box-sizing: border-box;">

                    <textarea id="codeInput" placeholder="AI command yahan aayegi ya manually type karo..."></textarea>
                    
                    <button class="btn-upload" onclick="sendCode()">▶ Upload to UNO</button>
                    
                    <button class="btn-ai-mic" id="aiMicBtn" onclick="talkToAI()">🎙 Talk to AI (Sahab Mode)</button>
                    
                    <p id="aiStatus" style="color: #38bdf8; font-size: 14px; text-align: center; margin-top: 10px;"></p>
                </div>

                <!-- Screen: 2D Preview -->
                <div class="screen" id="screenPreview">
                    <h2 class="title">2D Path Validation</h2>
                    <div class="preview-box">
                        <div style="font-size: 40px;">🚙</div>
                        <div style="color: #cbd5e1; margin-top: 10px;" id="previewStatus">Awaiting AI/Manual Command...</div>
                    </div>
                </div>

            </div>
        </div>

        <button class="fab-camera" onclick="openCamera()">📷</button>

        <div class="bottom-nav">
            <button class="nav-btn active" id="navEditor" onclick="slideTo(0)">Code Editor</button>
            <button class="nav-btn" id="navPreview" onclick="slideTo(1)">2D Preview</button>
        </div>
    </div>

    <script>
        // ============================================================
        // --- AI Selection State ---
        // ============================================================
        let selectedAI = 'gemini'; // Default

        function switchAI(provider) {
            selectedAI = provider;
            const gemBtn = document.getElementById('btnSelectGemini');
            const oaiBtn = document.getElementById('btnSelectOpenAI');
            const keyInput = document.getElementById('apiKeyInput');

            if (provider === 'gemini') {
                gemBtn.classList.add('active');
                oaiBtn.classList.remove('active');
                keyInput.placeholder = "Paste Gemini API Key (AIzaSy...)";
            } else {
                oaiBtn.classList.add('active');
                gemBtn.classList.remove('active');
                keyInput.placeholder = "Paste OpenAI API Key (sk-...)";
            }
        }

        // ============================================================
        // --- Refresh WebView Logic ---
        // ============================================================
        function refreshApp() {
            const cleanUrl = window.location.origin + window.location.pathname;
            window.location.href = cleanUrl + '?t=' + new Date().getTime();
        }

        // ============================================================
        // --- Navigation Logic ---
        // ============================================================
        function openCarController() {
            document.getElementById('homeScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
        }

        function goBackToHome() {
            document.getElementById('mainApp').style.display = 'none';
            document.getElementById('homeScreen').style.display = 'flex';
        }

        function slideTo(index) {
            const slider = document.getElementById('appSlider');
            const navEditor = document.getElementById('navEditor');
            const navPreview = document.getElementById('navPreview');

            if (index === 0) {
                slider.style.transform = 'translateX(0vw)';
                navEditor.classList.add('active');
                navPreview.classList.remove('active');
            } else {
                slider.style.transform = 'translateX(-100vw)';
                navPreview.classList.add('active');
                navEditor.classList.remove('active');
            }
        }

        // ============================================================
        // --- Hardware Bridge (Android) ---
        // ============================================================
        function sendCode() {
            const code = document.getElementById('codeInput').value.trim();

            if (!code) {
                alert("Pehle koi command likho sahab!");
                return;
            }

            if (window.CarBridge && typeof window.CarBridge.sendCommand === 'function') {
                window.CarBridge.sendCommand(code);
            } else {
                alert("Testing in Browser: " + code);
            }

            document.getElementById('previewStatus').innerText =
                "Path Validated ✅\nCommand: " + code;
            document.getElementById('previewStatus').style.color = "#10b981";

            setTimeout(() => slideTo(1), 300);
        }

        function openCamera() {
            if (window.CarBridge && typeof window.CarBridge.openCamera === 'function') {
                window.CarBridge.openCamera();
            } else {
                alert("Camera sirf Android app mein open hoga.");
            }
        }

        // ============================================================
        // --- Shared Prompt ---
        // ============================================================
        const systemPrompt = `Tum ek mazedar aur smart AI assistant ho jo ek RC Car ko control karta hai. Tumhe user ko hamesha 'Sahab' bulana hai. 
Agar user car ko move karne bole par distance ya time na bataye (jaise "car aage badhao"), toh gusse/mazaak me Hinglish me puchna: 'Aage toh le jau sahab, par kitna aage? Thukwaani hai kya gaadi?'.
Agar user poori command de (jaise 5 sec aage, 2 speed pe), toh action accept karna.
TUMHARA RESPONSE HAMESHA EK STRICT JSON FORMAT ME HONA CHAHIYE. Koi aur extra text ya markdown mat likhna.
Format:
{
    "reply_text": "Tumhara Hinglish dialogue",
    "action_code": "FWD:5000:2 ya BWD:3000:1 (agar invalid command ho toh '')"
}`;

        // ============================================================
        // --- NATIVE VOICE — Android Google Voice Typing use karega ---
        // ============================================================
        function talkToAI() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();

            if (!apiKey) {
                alert(`Pehle ${selectedAI === 'gemini' ? 'Gemini' : 'OpenAI'} API Key daalo sahab!`);
                return;
            }

            // Android native mic ko bulao
            if (window.CarBridge && typeof window.CarBridge.startVoiceRecognition === 'function') {
                window.CarBridge.startVoiceRecognition();
            } else {
                // Browser fallback (PC testing)
                const typed = prompt("Android App nahi mila. Command type karo (Sahab):");
                if (typed && typed.trim()) {
                    routeAI(typed.trim(), apiKey);
                }
            }
        }

        // Android app is function ko call karega jab tum bol chukoge
        window.receiveVoiceInput = async function(spokenText) {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const aiStatus = document.getElementById('aiStatus');
            const micBtn = document.getElementById('aiMicBtn');

            if (!apiKey) {
                aiStatus.innerText = "⚠️ API Key gayab ho gayi. Dobara daalo.";
                return;
            }

            aiStatus.innerText = `Aapne bola: "${spokenText}"\nSoch raha hu...`;
            micBtn.innerText = "⏳ Processing...";
            micBtn.style.background = "linear-gradient(135deg, #f59e0b, #d97706)";

            await routeAI(spokenText, apiKey);

            micBtn.innerText = "🎙 Talk to AI (Sahab Mode)";
            micBtn.style.background = "linear-gradient(135deg, #8b5cf6, #6d28d9)";
        };

        // ============================================================
        // --- Router ---
        // ============================================================
        async function routeAI(userInput, apiKey) {
            if (selectedAI === 'gemini') {
                await callGemini(userInput, apiKey);
            } else {
                await callOpenAI(userInput, apiKey);
            }
        }

        // ============================================================
        // --- 1. Google Gemini API ---
        // ============================================================
        async function callGemini(userInput, apiKey) {
            const aiStatus = document.getElementById('aiStatus');
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: { parts: [{ text: systemPrompt }] },
                        contents: [{ parts: [{ text: userInput }] }],
                        generationConfig: { response_mime_type: "application/json" }
                    })
                });

                if (!response.ok) {
                    const err = await response.json();
                    aiStatus.innerText = "Gemini Error: " + (err.error?.message || "Check API Key");
                    return;
                }

                const data = await response.json();
                const rawJson = data.candidates[0].content.parts[0].text;
                handleSuccess(JSON.parse(rawJson));

            } catch (error) {
                aiStatus.innerText = "Gemini Fail: " + error.message;
            }
        }

        // ============================================================
        // --- 2. OpenAI GPT API ---
        // ============================================================
        async function callOpenAI(userInput, apiKey) {
            const aiStatus = document.getElementById('aiStatus');

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "gpt-4o-mini",
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: userInput }
                        ],
                        temperature: 0.7
                    })
                });

                if (!response.ok) {
                    const err = await response.json();
                    aiStatus.innerText = "OpenAI Error: " + (err.error?.message || "Check API Key/Quota");
                    return;
                }

                const data = await response.json();
                let content = data.choices[0].message.content;
                if (content.includes('```json')) {
                    content = content.replace(/```json/g, '').replace(/```/g, '').trim();
                }
                handleSuccess(JSON.parse(content));

            } catch (error) {
                aiStatus.innerText = "OpenAI Fail: " + error.message;
            }
        }

        // ============================================================
        // --- Response Handler & Speech ---
        // ============================================================
        function handleSuccess(aiData) {
            speak(aiData.reply_text || "Hukum kijiye sahab.");
            document.getElementById('aiStatus').innerText = `AI: ${aiData.reply_text || "No reply"}`;

            if (aiData.action_code && aiData.action_code.trim() !== "") {
                document.getElementById('codeInput').value = aiData.action_code.trim();
                document.getElementById('aiStatus').innerText += "\n✅ Command Generated! UNO ko bhejo.";
            }
        }

        function speak(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'hi-IN';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
