<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Wireless Controller</title>
    <style>
        /* Modern Reset & Dark Glassmorphic Theme */
        body { 
            margin: 0; 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: #0b0f19; 
            color: #ffffff; 
            overflow: hidden; 
        }
        
        /* --- HOME SCREEN UI --- */
        #homeScreen {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #0b0f19;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 80px;
            box-sizing: border-box;
        }
        .home-title { font-size: 28px; font-weight: bold; margin-bottom: 40px; color: #f8fafc; }
        
        .device-card {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            width: 80%;
            padding: 40px 20px;
            border-radius: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .device-card:active { transform: scale(0.95); }

        /* --- MAIN APP UI --- */
        #mainApp {
            display: none;
            width: 100vw; height: 100vh;
        }

        .header { 
            background: rgba(15, 23, 42, 0.7); 
            backdrop-filter: blur(10px); 
            padding: 15px 20px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .back-btn { 
            background: none; 
            border: none; 
            color: #38bdf8; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
        }

        /* --- NEW: Refresh Button --- */
        .refresh-btn {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .refresh-btn:active {
            transform: scale(0.92);
            background: rgba(56, 189, 248, 0.3);
        }
        .refresh-btn.spinning {
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        .viewport {
            width: 100vw;
            height: calc(100vh - 120px); 
            overflow: hidden;
            position: relative;
        }
        .slider {
            display: flex;
            width: 200vw; 
            height: 100%;
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .screen {
            width: 100vw; height: 100%;
            padding: 20px; box-sizing: border-box;
            overflow-y: auto;
        }

        .title { margin-top: 0; font-size: 22px; font-weight: 600; color: #f1f5f9; }
        
        textarea { 
            width: 100%; height: 180px; 
            background: rgba(30, 41, 59, 0.6); 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 12px; padding: 15px; 
            color: #10b981; font-family: monospace; font-size: 16px; 
            box-sizing: border-box; resize: none; 
            margin-bottom: 20px;
        }

        .btn-upload { 
            background: linear-gradient(135deg, #0284c7, #2563eb); 
            border: none; padding: 16px; width: 100%; 
            border-radius: 12px; color: white; font-weight: bold; 
            font-size: 16px; cursor: pointer;
        }

        .btn-ai-mic {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            border: none; padding: 16px; width: 100%; 
            border-radius: 12px; color: white; font-weight: bold; 
            font-size: 16px; cursor: pointer; margin-top: 15px;
            box-shadow: 0 4px 15px rgba(109, 40, 217, 0.4);
        }

        .fab-camera {
            position: fixed; bottom: 80px; right: 20px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            width: 60px; height: 60px; border-radius: 30px;
            display: flex; justify-content: center; align-items: center;
            border: none; font-size: 24px; cursor: pointer;
        }

        .preview-box {
            background: rgba(30, 41, 59, 0.4);
            border: 1px dashed rgba(255,255,255,0.2);
            border-radius: 12px; height: 250px;
            display: flex; align-items: center; justify-content: center; flex-direction: column;
        }

        .bottom-nav { 
            position: fixed; bottom: 0; width: 100vw; height: 60px;
            display: flex; background: rgba(15, 23, 42, 0.95); 
            border-top: 1px solid rgba(255,255,255,0.05); 
        }
        .nav-btn { 
            flex: 1; background: none; border: none; 
            color: #64748b; font-size: 15px; font-weight: 600; 
            border-top: 2px solid transparent;
        }
        .nav-btn.active { color: #38bdf8; border-top: 2px solid #38bdf8; }
    </style>
</head>
<body>

    <!-- SCREEN 1: Home Screen (Device Selection) -->
    <div id="homeScreen">
        <div class="home-title">Select Your Device</div>
        <div class="device-card" onclick="openCarController()">
            🚗 AI Smart Car
        </div>
    </div>

    <!-- MAIN APP: Shown after selecting car -->
    <div id="mainApp">
        <div class="header">
            <button class="back-btn" onclick="goBackToHome()">← Back to Devices</button>

            <!-- ✅ NEW: Cache-Busting Refresh Button -->
            <button class="refresh-btn" id="refreshBtn" onclick="forceRefresh()">
                <span id="refreshIcon">🔄</span> Refresh
            </button>
        </div>

        <div class="viewport">
            <div class="slider" id="appSlider">
                
                <!-- Screen: Code Editor / AI Control -->
                <div class="screen" id="screenEditor">
                    <h2 class="title">Command Center</h2>
                    
                    <input type="password" id="apiKeyInput" placeholder="Paste OpenAI API Key here..." style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 8px; background: rgba(0,0,0,0.5); border: 1px solid #333; color: white; box-sizing: border-box;">

                    <textarea id="codeInput" placeholder="AI ki command yahan aayegi... ya khud type karo"></textarea>
                    
                    <button class="btn-upload" onclick="sendCode()">▶ Upload to UNO</button>
                    
                    <button class="btn-ai-mic" id="aiMicBtn" onclick="talkToAI()">🎙 Talk to AI (Sahab Mode)</button>
                    
                    <p id="aiStatus" style="color: #38bdf8; font-size: 14px; text-align: center; margin-top: 10px;"></p>
                </div>

                <!-- Screen: 2D Preview -->
                <div class="screen" id="screenPreview">
                    <h2 class="title">2D Path Validation</h2>
                    <div class="preview-box">
                        <div style="font-size: 40px;">🚙</div>
                        <div style="color: #cbd5e1; margin-top: 10px;" id="previewStatus">Awaiting AI/Manual Command...</div>
                    </div>
                </div>

            </div>
        </div>

        <button class="fab-camera" onclick="openCamera()">📷</button>

        <div class="bottom-nav">
            <button class="nav-btn active" id="navEditor" onclick="slideTo(0)">Code Editor</button>
            <button class="nav-btn" id="navPreview" onclick="slideTo(1)">2D Preview</button>
        </div>
    </div>

    <script>
        // ============================================================
        // --- Navigation Logic ---
        // ============================================================
        function openCarController() {
            document.getElementById('homeScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
        }

        function goBackToHome() {
            document.getElementById('mainApp').style.display = 'none';
            document.getElementById('homeScreen').style.display = 'flex';
        }

        function slideTo(index) {
            const slider = document.getElementById('appSlider');
            const navEditor = document.getElementById('navEditor');
            const navPreview = document.getElementById('navPreview');

            if (index === 0) {
                slider.style.transform = 'translateX(0vw)';
                navEditor.classList.add('active');
                navPreview.classList.remove('active');
            } else {
                slider.style.transform = 'translateX(-100vw)';
                navPreview.classList.add('active');
                navEditor.classList.remove('active');
            }
        }

        // ============================================================
        // --- NEW: Cache-Busting Refresh Logic ---
        // ============================================================
        function forceRefresh() {
            // Animate the refresh icon
            const icon = document.getElementById('refreshIcon');
            if (icon) {
                icon.classList.add('spinning');
            }

            // Small delay so animation is visible before reload
            setTimeout(() => {
                try {
                    // Method 1: Force hard reload from server (ignore cache)
                    // Most modern browsers/WebView treat this as a hard reload
                    window.location.reload(true);
                } catch (e) {
                    console.warn("reload(true) failed, trying cache-bust query:", e);
                    // Method 2: Fallback — bust cache via timestamp query param
                    const url = new URL(window.location.href);
                    url.searchParams.set('_t', Date.now().toString());
                    window.location.href = url.toString();
                }

                // Method 3: Extra safety — if reload didn't trigger,
                // force a cache-bust URL after 500ms
                setTimeout(() => {
                    const url = new URL(window.location.href);
                    url.searchParams.set('_t', Date.now().toString());
                    window.location.replace(url.toString());
                }, 500);
            }, 250);
        }

        // ============================================================
        // --- Hardware Bridge (Android) ---
        // ============================================================
        function sendCode() {
            const code = document.getElementById('codeInput').value.trim();

            if (!code) {
                alert("Pehle koi command likho sahab!");
                return;
            }

            if (window.CarBridge && typeof window.CarBridge.sendCommand === 'function') {
                window.CarBridge.sendCommand(code);
                console.log("Command sent to Android:", code);
            } else {
                console.log("CarBridge not available (running in browser)");
                alert("Android app mein open karo tabhi command jayega.");
            }

            document.getElementById('previewStatus').innerText =
                "Path Validated ✅\nCommand: " + code;
            document.getElementById('previewStatus').style.color = "#10b981";

            setTimeout(() => slideTo(1), 300);
        }

        function openCamera() {
            if (window.CarBridge && typeof window.CarBridge.openCamera === 'function') {
                window.CarBridge.openCamera();
                console.log("openCamera() called");
            } else {
                console.log("CarBridge not available");
                alert("Camera sirf Android app mein kaam karega.");
            }
        }

        function connectBluetooth(macAddress) {
            if (!macAddress) {
                macAddress = prompt("ESP32 ka MAC Address daalo (example: AA:BB:CC:DD:EE:FF)");
            }
            if (!macAddress) return;

            if (window.CarBridge && typeof window.CarBridge.connectBluetooth === 'function') {
                window.CarBridge.connectBluetooth(macAddress);
                console.log("Connecting to:", macAddress);
            } else {
                console.log("CarBridge not available");
                alert("Bluetooth connection sirf Android app mein possible hai.");
            }
        }

        // ============================================================
        // --- GPT AI INTEGRATION ---
        // ============================================================
        const systemPrompt = `Tum ek mazedar aur smart AI assistant ho jo ek RC Car ko control karta hai. Tumhe user ko hamesha 'Sahab' bulana hai. 
Agar user car ko move karne bole par distance ya time na bataye (jaise "car aage badhao"), toh gusse/mazaak me Hinglish me puchna: 'Aage toh le jau sahab, par kitna aage? Thukwaani hai kya gaadi?'.
Agar user poori command de (jaise 5 sec aage, 2 speed pe), toh action accept karna.
TUMHARA RESPONSE HAMESHA EK STRICT JSON FORMAT ME HONA CHAHIYE. Koi aur text mat likhna.
Format:
{
    "reply_text": "Tumhara Hinglish dialogue",
    "action_code": "FWD:5000:2 ya BWD:3000:1 (ya agar command invalid hai toh khali string chhod do '')"
}`;

        function talkToAI() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const aiStatus = document.getElementById('aiStatus');
            const micBtn = document.getElementById('aiMicBtn');

            if (!apiKey) {
                alert("Pehle OpenAI API Key daalo sahab!");
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                aiStatus.innerText = "⚠️ Speech recognition not supported. Type karke try karo.";
                const typed = prompt("Type your command (Sahab):");
                if (typed && typed.trim()) {
                    callGPT(typed.trim(), apiKey);
                }
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = function () {
                micBtn.innerText = "🔴 Listening... Bolo Sahab!";
                micBtn.style.background = "linear-gradient(135deg, #ef4444, #b91c1c)";
                aiStatus.innerText = "Suntan raha hu...";
            };

            recognition.onresult = async function (event) {
                const userVoiceText = event.results[0][0].transcript;
                aiStatus.innerText = `Tumne kaha: "${userVoiceText}"\nSoch raha hu...`;
                micBtn.innerText = "⏳ Processing...";
                micBtn.style.background = "linear-gradient(135deg, #f59e0b, #d97706)";

                await callGPT(userVoiceText, apiKey);
            };

            recognition.onerror = function (event) {
                console.error("Speech error:", event.error);
                aiStatus.innerText = "Awaaz samajh nahi aayi. Firse try karo.";
                micBtn.innerText = "🎙 Talk to AI (Sahab Mode)";
                micBtn.style.background = "linear-gradient(135deg, #8b5cf6, #6d28d9)";
            };

            recognition.start();
        }

        // ============================================================
        // --- callGPT() with detailed error reporting ---
        // ============================================================
        async function callGPT(userInput, apiKey) {
            const aiStatus = document.getElementById('aiStatus');
            const micBtn = document.getElementById('aiMicBtn');

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "gpt-4o-mini",
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: userInput }
                        ],
                        temperature: 0.7
                    })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    aiStatus.innerText = "API Error: " +
                        (errData.error?.message || "Unknown API Error");
                    micBtn.innerText = "🎙 Talk to AI (Sahab Mode)";
                    micBtn.style.background = "linear-gradient(135deg, #8b5cf6, #6d28d9)";
                    return;
                }

                const data = await response.json();

                let aiResponseStr = data.choices[0].message.content;
                if (aiResponseStr.includes('```json')) {
                    aiResponseStr = aiResponseStr
                        .replace(/```json/g, '')
                        .replace(/```/g, '')
                        .trim();
                }

                let aiData;
                try {
                    aiData = JSON.parse(aiResponseStr);
                } catch (parseErr) {
                    console.error("JSON Parse Error:", parseErr, aiResponseStr);
                    aiStatus.innerText = "AI ne galat format mein jawab diya. Dobara try karo.";
                    micBtn.innerText = "🎙 Talk to AI (Sahab Mode)";
                    micBtn.style.background = "linear-gradient(135deg, #8b5cf6, #6d28d9)";
                    return;
                }

                speak(aiData.reply_text || "Samajh nahi aaya sahab.");
                aiStatus.innerText = `AI: ${aiData.reply_text || "No reply"}`;

                if (aiData.action_code && aiData.action_code.trim() !== "") {
                    document.getElementById('codeInput').value = aiData.action_code.trim();
                    aiStatus.innerText += "\n✅ Code Updated! Press Upload.";
                }

                micBtn.innerText = "🎙 Talk to AI (Sahab Mode)";
                micBtn.style.background = "linear-gradient(135deg, #8b5cf6, #6d28d9)";

            } catch (error) {
                console.error(error);
                aiStatus.innerText = "System Error: " + error.message;
                micBtn.innerText = "🎙 Talk to AI (Sahab Mode)";
                micBtn.style.background = "linear-gradient(135deg, #8b5cf6, #6d28d9)";
            }
        }

        // ============================================================
        // --- Text to Speech ---
        // ============================================================
        function speak(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'hi-IN';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
