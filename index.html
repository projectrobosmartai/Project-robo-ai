<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Wireless Controller</title>
    <style>
        /* Modern Reset & Dark Glassmorphic Theme */
        body { 
            margin: 0; 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: #0b0f19; 
            color: #ffffff; 
            overflow: hidden; /* Prevent native scrolling to control slide */
        }
        
        /* Header */
        .header { 
            background: rgba(15, 23, 42, 0.7); 
            backdrop-filter: blur(10px); 
            padding: 15px 20px; 
            display: flex; 
            align-items: center; 
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 10;
        }
        .back-btn { 
            background: none; 
            border: none; 
            color: #38bdf8; 
            font-size: 16px; 
            font-weight: 600; 
            padding: 5px 10px 5px 0; 
            cursor: pointer; 
        }

        /* Viewport & Sliding Mechanism */
        .viewport {
            width: 100vw;
            height: calc(100vh - 60px); /* Minus bottom nav height */
            overflow: hidden;
            position: relative;
        }
        .slider {
            display: flex;
            width: 200vw; /* 2 screens width */
            height: 100%;
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .screen {
            width: 100vw;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        /* Code Editor UI */
        .title { margin-top: 0; font-size: 22px; font-weight: 600; color: #f1f5f9; }
        
        textarea { 
            width: 100%; 
            height: 180px; 
            background: rgba(30, 41, 59, 0.6); 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 12px; 
            padding: 15px; 
            color: #10b981; 
            font-family: 'Courier New', Courier, monospace; 
            font-size: 16px; 
            box-sizing: border-box; 
            resize: none; 
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        textarea:focus { outline: 1px solid #38bdf8; }

        .btn-upload { 
            background: linear-gradient(135deg, #0284c7, #2563eb); 
            border: none; 
            padding: 16px; 
            width: 100%; 
            border-radius: 12px; 
            color: white; 
            font-weight: bold; 
            font-size: 16px; 
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4); 
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-upload:active { opacity: 0.8; transform: scale(0.98); }

        /* Floating Action Button (Camera) */
        .fab-camera {
            position: fixed;
            bottom: 80px;
            right: 20px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            width: 60px;
            height: 60px;
            border-radius: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.5);
            border: none;
            font-size: 24px;
            z-index: 100;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .fab-camera:active { transform: scale(0.9); }

        /* 2D Preview UI */
        .preview-box {
            background: rgba(30, 41, 59, 0.4);
            border: 1px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .preview-status { color: #cbd5e1; font-size: 18px; margin-top: 10px; }

        /* Bottom Navigation */
        .bottom-nav { 
            position: fixed; 
            bottom: 0; 
            width: 100vw; 
            height: 60px;
            display: flex; 
            background: rgba(15, 23, 42, 0.95); 
            backdrop-filter: blur(15px); 
            border-top: 1px solid rgba(255,255,255,0.05); 
            z-index: 50;
        }
        .nav-btn { 
            flex: 1; 
            background: none; 
            border: none; 
            color: #64748b; 
            font-size: 15px; 
            font-weight: 600; 
            transition: all 0.3s; 
            border-top: 2px solid transparent;
        }
        .nav-btn.active { 
            color: #38bdf8; 
            border-top: 2px solid #38bdf8; 
            background: linear-gradient(to top, rgba(56, 189, 248, 0.1), transparent);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <button class="back-btn" onclick="alert('Going to Home Screen')">← Back</button>
    </div>

    <!-- Main Viewport for Sliding Screens -->
    <div class="viewport">
        <div class="slider" id="appSlider">
            
            <!-- Screen 1: Code Editor -->
            <div class="screen" id="screenEditor">
                <h2 class="title">Code Editor</h2>
                <textarea id="codeInput" placeholder="Type command here... e.g., FWD:5000:2"></textarea>
                <button class="btn-upload" onclick="sendCode()">▶ Upload & Run Code</button>
            </div>

            <!-- Screen 2: 2D Preview -->
            <div class="screen" id="screenPreview">
                <h2 class="title">2D Validation</h2>
                <div class="preview-box">
                    <div style="font-size: 40px;">🚙</div>
                    <div class="preview-status" id="previewStatus">Waiting for upload...</div>
                </div>
            </div>

        </div>
    </div>

    <!-- Floating Camera Button -->
    <button class="fab-camera" onclick="openCamera()">📷</button>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <button class="nav-btn active" id="navEditor" onclick="slideTo(0)">Code Editor</button>
        <button class="nav-btn" id="navPreview" onclick="slideTo(1)">2D Preview</button>
    </div>

    <script>
        // Slide Animation Logic
        function slideTo(index) {
            const slider = document.getElementById('appSlider');
            const navEditor = document.getElementById('navEditor');
            const navPreview = document.getElementById('navPreview');

            if (index === 0) {
                slider.style.transform = 'translateX(0vw)';
                navEditor.classList.add('active');
                navPreview.classList.remove('active');
            } else {
                slider.style.transform = 'translateX(-100vw)';
                navPreview.classList.add('active');
                navEditor.classList.remove('active');
            }
        }

        // Android Bridge Integration
        function sendCode() {
            let code = document.getElementById('codeInput').value;
            
            if (window.CarBridge) {
                window.CarBridge.sendCommand(code);
            } else {
                alert("Test: Command '" + code + "' sent.");
            }

            // Auto-slide to preview and update status
            document.getElementById('previewStatus').innerText = "Path OK ✅";
            document.getElementById('previewStatus').style.color = "#10b981";
            setTimeout(() => slideTo(1), 300); // Slide after short delay
        }

        function openCamera() {
            if (window.CarBridge) {
                window.CarBridge.openCamera();
            } else {
                alert("Test: Opening AI Camera...");
            }
        }
    </script>
</body>
</html>
